name: BuildGuard CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libyaml-cpp-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja

      - name: Build project
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run BuildGuard scan
        run: |
          ./build/buildguard scan .

      - name: Generate JSON report
        run: |
          ./build/buildguard report .

      - name: Display report
        run: |
          cat reports/buildguard_report.json
